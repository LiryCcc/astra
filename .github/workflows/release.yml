name: Release

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.0.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha) }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  NODE_VERSION: '24'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha) }}
  ASTRA_WORKSPACE: ${{ github.workspace }}
  ASTRA_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha) }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Code quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run checks
        run: pnpm check

  android-apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename artifact
        run: pnpm ci:rename-android-apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: astra-android-*.apk
          if-no-files-found: error

  ios-ipa:
    name: iOS IPA
    needs: check
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: pnpm ci:package-ios-ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: astra-ios-unsigned-*.ipa
          if-no-files-found: error

  macos-zip:
    name: macOS ZIP
    needs: check
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure static linking
        run: pnpm ci:configure-static-link

      - name: Build macOS
        run: flutter build macos --release

      - name: Package portable zip
        env:
          ASTRA_PACKAGE_TARGET: zip
        run: pnpm ci:package-macos-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: astra-macos-*-portable.zip
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG
    needs: check
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure static linking
        run: pnpm ci:configure-static-link

      - name: Build macOS
        run: flutter build macos --release

      - name: Package DMG
        env:
          ASTRA_PACKAGE_TARGET: dmg
        run: pnpm ci:package-macos-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: astra-macos-*.dmg
          if-no-files-found: error

  macos-standalone:
    name: macOS standalone
    needs: check
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure static linking
        run: pnpm ci:configure-static-link

      - name: Build macOS
        run: flutter build macos --release

      - name: Package standalone
        env:
          ASTRA_PACKAGE_TARGET: standalone
        run: pnpm ci:package-macos-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-standalone
          path: astra-macos-*-standalone.run
          if-no-files-found: error

  windows-zip:
    name: Windows ZIP
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure static linking
        run: pnpm ci:configure-static-link

      - name: Build Windows
        run: flutter build windows --release

      - name: Package portable zip
        env:
          ASTRA_PACKAGE_TARGET: zip
        run: pnpm ci:package-windows-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: astra-windows-*-portable.zip
          if-no-files-found: error

  windows-setup:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install packaging tools
        run: pnpm ci:install-windows-packaging-tools

      - name: Configure static linking
        run: pnpm ci:configure-static-link

      - name: Build Windows
        run: flutter build windows --release

      - name: Package installer
        env:
          ASTRA_PACKAGE_TARGET: setup
        run: pnpm ci:package-windows-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: astra-windows-*-setup.exe
          if-no-files-found: error

  windows-standalone:
    name: Windows standalone
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install packaging tools
        run: pnpm ci:install-windows-packaging-tools

      - name: Configure static linking
        run: pnpm ci:configure-static-link

      - name: Build Windows
        run: flutter build windows --release

      - name: Package standalone
        env:
          ASTRA_PACKAGE_TARGET: standalone
        run: pnpm ci:package-windows-artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone
          path: astra-windows-*-standalone.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - android-apk
      - ios-ipa
      - macos-zip
      - macos-dmg
      - macos-standalone
      - windows-zip
      - windows-setup
      - windows-standalone
    if: >-
      always() &&
      (
        needs.android-apk.result == 'success' ||
        needs.ios-ipa.result == 'success' ||
        needs.macos-zip.result == 'success' ||
        needs.macos-dmg.result == 'success' ||
        needs.macos-standalone.result == 'success' ||
        needs.windows-zip.result == 'success' ||
        needs.windows-setup.result == 'success' ||
        needs.windows-standalone.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Astra ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
